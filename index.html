<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


  <script defer src="index.js"></script>
</head>
<body>
  <div class="container my-4">
    <div class="card p-4 shadow">
      <div class="row g-4">
        <!-- Input Section -->
        <div class="col-md-6">
          <h1 class="h3 mb-3 text-center text-md-start">Expense Tracker</h1>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <input id="Category" type="text" class="form-control" placeholder="Enter a category" />
          </div>
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input id="Amount" type="number" class="form-control" placeholder="Enter amount" />
          </div>
          <button class="btn btn-success w-100" id="addBtn">Add Expense</button>
        </div>


        <div class="col-md-6">
          <div class="row text-center">
            <div class="col-6">
              <h4>Total</h4>
              
              <h3 id="amt"  >$<span id="total" class="text-success" >0</span></h3>
            </div>
            <div class="col-6">
              <h4>Monthly Average</h4>
              <h3 id="amt">$<span id="Avarage"class="text-success">0</span></h3>
            </div>
            <div class="col-12 mt-3">
              <h4>Entries</h4>
              <h3><span id="Entery">0</span></h3>
            </div>
          </div>
        </div>
      </div>

      <div class="row my-4">
        <div class="col-12">
          <div class="card p-3">
            <canvas id="expenseChart" style="max-height:300px;"></canvas>
          </div>
        </div>
      </div>

  
      <div class="row">
        <div class="col-12">
          <div id="exapenseList" class="table-responsive"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
